name: Beta

# Cada push a la rama dev compila "Speckweg Beta" (app aparte, con sus propios datos)
# y la publica en la release "beta". La Beta instalada lo detecta al abrirse y se actualiza sola.
on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: beta
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - run: npm test -- --watch=false

      # Falla pronto y con un mensaje claro si falta la clave privada de firma de actualizaciones.
      - name: Comprobar clave de firma
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Falta el secreto TAURI_SIGNING_PRIVATE_KEY (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          echo "Clave de firma presente (${#KEY} caracteres)."

      # Versión de la Beta: la de tauri.conf.json + "-beta.N", para que cada build sea más nueva que la anterior.
      - name: Poner versión beta
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const base = require('./src-tauri/tauri.conf.json').version;
            const p = './src-tauri/tauri.beta.conf.json';
            const beta = JSON.parse(fs.readFileSync(p, 'utf8'));
            beta.version = base + '-beta.' + process.env.GITHUB_RUN_NUMBER;
            fs.writeFileSync(p, JSON.stringify(beta, null, 2));
            console.log('Versión beta:', beta.version);
            fs.appendFileSync(process.env.GITHUB_ENV, 'BETA_VERSION=' + beta.version + '\\n');
          "

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --config src-tauri/tauri.beta.conf.json
          tagName: beta
          releaseName: 'Speckweg Beta'
          releaseBody: 'Versión de pruebas. Descarga el **-setup.exe**, instálalo una vez y a partir de ahí se actualiza sola al abrirla. Se instala aparte de Speckweg y tiene sus propios datos.'
          releaseDraft: false
          prerelease: true
          includeUpdaterJson: true

      # La release "beta" se reutiliza. Los instaladores viejos se borran DESPUÉS de subir el nuevo,
      # para que latest.json nunca apunte a un archivo que no existe mientras se compila.
      - name: Borrar instaladores beta anteriores
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view beta --json assets --jq '.assets[].name' | while IFS= read -r asset; do
            if [ "$asset" != "latest.json" ] && [[ "$asset" != *"_${BETA_VERSION}_"* ]]; then
              gh release delete-asset beta "$asset" --yes
            fi
          done
