name: Release

# Compila el instalador de Windows y lo publica como Release en GitHub.
# Se lanza al subir una etiqueta vX.Y.Z (git tag v0.2.0 && git push origin v0.2.0)
# o a mano desde la pestaña Actions.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: 'Speckweg v__VERSION__'
          releaseBody: 'Descarga **Speckweg_x.y.z_x64-setup.exe**, ábrelo y sigue el asistente. Se crea un acceso directo en el menú Inicio (y en el escritorio si marcas la casilla al final).'
          releaseDraft: false
          prerelease: false
