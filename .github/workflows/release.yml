name: Release

# Publica el instalador como Release en GitHub. Se lanza a mano desde
# Actions → Release → Run workflow, eligiendo:
#   - prueba: pre-release vX.Y.Z-beta.N (no se marca como la última versión)
#   - final:  versión vX.Y.Z (usa la versión de src-tauri/tauri.conf.json)
on:
  workflow_dispatch:
    inputs:
      tipo:
        description: 'Tipo de versión'
        type: choice
        options:
          - prueba
          - final
        default: prueba

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - run: npm test -- --watch=false

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tipo == 'final' && 'v__VERSION__' || format('v__VERSION__-beta.{0}', github.run_number) }}
          releaseName: ${{ inputs.tipo == 'final' && 'Speckweg v__VERSION__' || format('Speckweg v__VERSION__ (prueba {0})', github.run_number) }}
          releaseBody: 'Descarga **Speckweg_x.y.z_x64-setup.exe**, ábrelo y sigue el asistente. Se crea un acceso directo en el menú Inicio (y en el escritorio si marcas la casilla al final).'
          releaseDraft: false
          prerelease: ${{ inputs.tipo != 'final' }}
