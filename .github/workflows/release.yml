name: Release

# Publica la versión final vX.Y.Z (la de src-tauri/tauri.conf.json) desde main.
# Se lanza a mano: Actions → Release → Run workflow. Solo después de validar la Beta.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - run: npm test -- --watch=false

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Speckweg v__VERSION__'
          releaseBody: 'Descarga **Speckweg_x.y.z_x64-setup.exe**, ábrelo y sigue el asistente. Si ya tienes Speckweg instalado, la app te avisará al abrirla y se actualiza sola.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
